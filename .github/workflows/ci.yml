name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check

  package:
    name: Package
    # The notification helper is Swift, so packaging needs a macOS runner.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # prepack builds both TypeScript and Swift exactly as npm publish does.
      - name: Inspect the publishable tarball
        run: npm pack --dry-run
      - name: Verify the built plugin loads
        run: node -e "import('./dist/index.js').then(m => { if (typeof m.default !== 'function') throw new Error('default export is not a plugin function') })"
      - name: Verify helper version
        run: |
          pkg="$(node -p "require('./package.json').version")"
          plist="swift/notch.app/Contents/Info.plist"
          bundle="$(plutil -extract CFBundleVersion raw -o - "$plist")"
          short="$(plutil -extract CFBundleShortVersionString raw -o - "$plist")"
          if [ "$bundle" != "$pkg" ] || [ "$short" != "$pkg" ]; then
            echo "Helper versions ($bundle, $short) do not match package version $pkg" >&2
            exit 1
          fi

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun audit
