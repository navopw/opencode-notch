name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    # The notification helper is Swift, so publishing needs a macOS runner.
    runs-on: macos-latest
    permissions:
      contents: read
      # Required for npm trusted publishing and provenance attestations.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $tag does not match package.json version $pkg" >&2
            exit 1
          fi

      # Makes re-run tags and the manually published first release no-ops
      # instead of failing the run on an already-published version.
      - name: Check whether the version is already on npm
        id: registry
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already published, skipping"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - run: bun run check
      - run: bun run build
      - run: bun run build:swift

      - name: Publish
        if: steps.registry.outputs.published == 'false'
        run: npm publish
